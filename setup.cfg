
[ nosetests ]
verbosity=2
with-coverage=1
cover-branch=1
cover-package=service
cover-erase=1

[ coverage:run ]
branch = True
source = service

[ coverage:report ]
show_missing = True
fail_under = 95
skip_covered = False

[ flake8 ]
count = True
statistics = True
show_source = True
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,venv

[ pylint ]
max-line-length = 127
disable = C0114,C0115,C0116
